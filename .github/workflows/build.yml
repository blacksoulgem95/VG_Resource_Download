# ---------------------------------------------------------------------------
# Costruisce gli installer per i tre sistemi e, sui tag `v*`, pubblica la
# release con i file allegati.
#
#   Linux    → .AppImage        (ubuntu-22.04: glibc 2.35, gira ovunque)
#   Windows  → setup .exe       (NSIS, x64, firmato Authenticode)
#   macOS    → .dmg             (arm64 + Intel, firmato Developer ID)
#
# Il bundle lo fa PyInstaller (packaging/vgdl.spec); poi ogni sistema ha il suo
# script di packaging in packaging/<sistema>/. I browser di Playwright NON
# vengono inclusi: l'app usa il Chrome installato dall'utente.
#
# Firma: senza i segreti le build riescono comunque, ma i pacchetti escono non
# firmati (macOS ripiega su una firma ad hoc). Vedi README → "Firma dei
# pacchetti" per l'elenco dei segreti.
# ---------------------------------------------------------------------------
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "icons/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Nessun bytecode nei pacchetti e log più leggibili.
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  # ===========================================================================
  linux:
    name: Linux (AppImage)
    # 22.04 e non latest: la glibc del runner diventa il requisito minimo
    # dell'AppImage (qui 2.35), quindi resta compatibile con le distribuzioni
    # più vecchie.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Qui si usa il Python di sistema (3.10 su 22.04) invece di
      # actions/setup-python: quei build non includono tkinter e il
      # `_tkinter.so` del pacchetto apt ha l'ABI di un'altra minor, quindi
      # non si può caricare. Con il Python di sistema `python3-tk` combacia
      # sempre.
      - name: Installa Python e tkinter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-venv python3-tk
          python3 -c "import tkinter; print('tkinter', tkinter.TkVersion)"
          python3 -m venv .build-venv
          .build-venv/bin/python -m pip install --upgrade pip
          .build-venv/bin/pip install -r requirements-build.txt
          echo "$PWD/.build-venv/bin" >> "$GITHUB_PATH"

      - name: Genera le icone native
        run: python packaging/make_icons.py

      - name: Build (PyInstaller)
        run: |
          set -o pipefail
          if ! pyinstaller --noconfirm --clean --log-level INFO packaging/vgdl.spec 2>&1 | tee pyinstaller.log; then
            echo "::group::ultime 150 righe del log"
            tail -150 pyinstaller.log
            echo "::endgroup::"
            for warn in packaging/build/*/warn-*.txt; do
              [ -e "$warn" ] || continue
              echo "::group::$warn"
              head -40 "$warn"
              echo "::endgroup::"
            done
            exit 1
          fi

      - name: Smoke test del bundle
        run: |
          set -euo pipefail
          ./dist/VGResourceDownload/vgdl --version
          ./dist/VGResourceDownload/vgdl --help > /dev/null
          # La GUI deve avere tkinter dentro, non solo il CLI.
          find dist/VGResourceDownload/_internal -name '_tkinter*.so' | head -1 | grep -q .
          echo "tkinter incluso"

      - name: Crea l'AppImage
        run: bash packaging/linux/build-appimage.sh

      - name: Prova l'AppImage
        run: |
          set -euo pipefail
          APPIMAGE=$(ls dist/*.AppImage | head -n 1)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract-and-run --version

      - name: Firma l'AppImage (GPG)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash packaging/linux/sign-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            dist/*.AppImage
            dist/*.AppImage.asc
          if-no-files-found: error
          retention-days: 14

  # ===========================================================================
  windows:
    name: Windows (NSIS)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Installa le dipendenze di build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Genera le icone native
        run: python packaging/make_icons.py

      - name: Build (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean --log-level INFO packaging/vgdl.spec 2>&1 |
            Tee-Object -FilePath pyinstaller.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host '--- ultime 150 righe del log ---'
            Get-Content pyinstaller.log -Tail 150
            Get-ChildItem packaging\build -Recurse -Filter 'warn-*.txt' -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "--- $($_.Name) ---"; Get-Content $_.FullName -Head 40 }
            exit 1
          }

      - name: Smoke test del bundle
        run: |
          $exe = 'dist\VGResourceDownload\vgdl.exe'
          if (-not (Test-Path $exe)) { throw "manca $exe" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "vgdl --version e uscito con $LASTEXITCODE" }
          if (-not (Test-Path 'dist\VGResourceDownload\VG Resource Download.exe')) {
            throw "manca l'eseguibile GUI"
          }
          # tkinter finisce nell'archivio PYZ: su disco resta solo l'estensione
          # compilata (_tkinter*.pyd), piu' i dati Tcl/Tk in _internal\.
          $tk = Get-ChildItem -Path 'dist\VGResourceDownload\_internal' -Recurse -Filter '_tkinter*.pyd'
          if (-not $tk) { throw 'tkinter non incluso nel bundle' }
          Write-Host "tkinter incluso: $($tk[0].Name)"

      - name: Firma gli eseguibili (Authenticode)
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERT_PFX_BASE64) {
            powershell -ExecutionPolicy Bypass -File packaging/windows/sign.ps1 `
              -Bundle 'dist\VGResourceDownload'
          } else {
            Write-Host 'Nessun certificato: build non firmata.' -ForegroundColor Yellow
          }

      - name: Assicura NSIS
        run: |
          $nsis = @(
            'C:\Program Files (x86)\NSIS\makensis.exe',
            'C:\Program Files\NSIS\makensis.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) {
            choco install nsis -y --no-progress
          }

      - name: Crea l'installer
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build-installer.ps1

      - name: Firma l'installer
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          # -SkipIfUnsigned: senza certificato la build resta verde.
          $installers = Get-ChildItem dist\*setup.exe | ForEach-Object { $_.FullName }
          powershell -ExecutionPolicy Bypass -File packaging/windows/sign.ps1 `
            -Path $installers -SkipIfUnsigned

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*setup.exe
          if-no-files-found: error
          retention-days: 14

  # ===========================================================================
  macos-arm64:
    name: macOS (dmg, arm64)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Installa le dipendenze di build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Genera le icone native
        run: python packaging/make_icons.py

      - name: Build (PyInstaller)
        run: |
          set -o pipefail
          if ! pyinstaller --noconfirm --clean --log-level INFO packaging/vgdl.spec 2>&1 | tee pyinstaller.log; then
            echo "::group::ultime 150 righe del log"
            tail -150 pyinstaller.log
            echo "::endgroup::"
            for warn in packaging/build/*/warn-*.txt; do
              [ -e "$warn" ] || continue
              echo "::group::$warn"
              head -40 "$warn"
              echo "::endgroup::"
            done
            exit 1
          fi
          if [ ! -d "dist/VG Resource Download.app" ]; then
            echo "il bundle .app non e stato creato; contenuto di dist/:"
            ls -la dist
            exit 1
          fi

      - name: Smoke test del bundle
        run: |
          set -euo pipefail
          "dist/VG Resource Download.app/Contents/MacOS/vgdl" --version
          ls "dist/VG Resource Download.app/Contents/Resources/" | grep -qi icns \
            && echo "icona presente"

      - name: Crea il DMG
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: bash packaging/macos/build-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  # ===========================================================================
  macos-intel:
    name: macOS (dmg, Intel)
    # macos-13 è l'ultimo runner Intel gratuito e GitHub lo sta ritirando:
    # se sparisce la build Intel viene saltata senza bloccare la release.
    runs-on: macos-13
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Installa le dipendenze di build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Genera le icone native
        run: python packaging/make_icons.py

      - name: Build (PyInstaller)
        run: |
          set -o pipefail
          if ! pyinstaller --noconfirm --clean --log-level INFO packaging/vgdl.spec 2>&1 | tee pyinstaller.log; then
            echo "::group::ultime 150 righe del log"
            tail -150 pyinstaller.log
            echo "::endgroup::"
            for warn in packaging/build/*/warn-*.txt; do
              [ -e "$warn" ] || continue
              echo "::group::$warn"
              head -40 "$warn"
              echo "::endgroup::"
            done
            exit 1
          fi
          test -d "dist/VG Resource Download.app"

      - name: Smoke test del bundle
        run: |
          set -euo pipefail
          "dist/VG Resource Download.app/Contents/MacOS/vgdl" --version

      - name: Crea il DMG
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: bash packaging/macos/build-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  # ===========================================================================
  # Release: solo sui tag v*, quando tutti e quattro i job sono passati.
  # ===========================================================================
  release:
    name: Pubblica la release
    needs: [linux, windows, macos-arm64, macos-intel]
    # Il job Intel è in continue-on-error, quindi non basta `needs` per
    # bloccarlo: si chiede esplicitamente la riuscita degli altri tre.
    if: |
      !cancelled() && startsWith(github.ref, 'refs/tags/v') &&
      needs.linux.result == 'success' &&
      needs.windows.result == 'success' &&
      needs['macos-arm64'].result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Controlla i file raccolti
        run: |
          set -euo pipefail
          ls -la artifacts
          for f in artifacts/*.AppImage artifacts/*.dmg artifacts/*setup.exe; do
            [ -e "$f" ] || { echo "manca $f"; exit 1; }
          done

      - name: Checksum SHA-256
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum *.AppImage *.dmg *setup.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false
